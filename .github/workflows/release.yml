name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: dotnet test HdrSwitch.sln -c Release

      - name: Publish single file
        run: >
          dotnet publish src/HdrSwitch/HdrSwitch.csproj -c Release -r win-x64
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --self-contained true -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/HdrSwitch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HdrSwitch.exe" | Out-File -Encoding ascii publish/HdrSwitch.exe.sha256
          Write-Host "SHA-256: $hash"

      # The release body is this version's CHANGELOG section. The app's update prompt shows its
      # bold bullet titles as "what's new", so the section must exist before tagging.
      - name: Release notes from CHANGELOG
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## \[$([regex]::Escape($version))\]" })
          if ($start -lt 0) { throw "CHANGELOG.md has no '## [$version]' section." }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## \[' })
          if ($end -lt 0) { $end = $lines.Length }
          $body = $lines[($start + 1)..($end - 1)] -join "`n"
          $body.Trim() | Out-File -Encoding utf8 publish/RELEASE_NOTES.md
          Get-Content publish/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          body_path: publish/RELEASE_NOTES.md
          files: |
            publish/HdrSwitch.exe
            publish/HdrSwitch.exe.sha256
