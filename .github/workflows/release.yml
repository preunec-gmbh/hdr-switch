name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Test
        run: dotnet test HdrSwitch.sln -c Release

      - name: Publish single file
        run: >
          dotnet publish src/HdrSwitch/HdrSwitch.csproj -c Release -r win-x64
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --self-contained true -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/HdrSwitch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HdrSwitch.exe" | Out-File -Encoding ascii publish/HdrSwitch.exe.sha256
          Write-Host "SHA-256: $hash"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            publish/HdrSwitch.exe
            publish/HdrSwitch.exe.sha256
